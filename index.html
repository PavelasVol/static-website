<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <link rel="stylesheet" href="css/site.css" />
    <style>
        /* ====== ГЛОБАЛЬНЫЙ СБРОС ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* ====== КАРТИНКИ ====== */
        #img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
            object-fit: contain; /* Вся картинка видна целиком */
            pointer-events: auto;
            background: #000;
        }

        #img0 {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
            object-fit: contain; /* Вся картинка видна целиком */
            pointer-events: none;
            background: transparent;
        }
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        #div {
            position: fixed;
            z-index: 100;
            display: none;
            background: rgb(0, 0, 139);
            border: 3px solid white;
            border-radius: 8px;
            padding: 8px 10px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

            #div table {
                width: 100%;
                height: 100%;
                background: transparent;
                color: #ffd800;
                border: none;
                display: flex;
                flex-direction: column;
            }

                #div table tbody {
                    display: flex;
                    flex-direction: column;
                    height: 100%;
                }

                #div table tr {
                    display: flex;
                    flex-direction: column;
                    flex-shrink: 0;
                    width: 100%;
                }

                #div table td {
                    padding: 3px 5px;
                    vertical-align: middle;
                    width: 100% !important;
                    box-sizing: border-box;
                }

        /* Заголовок объекта */
        .td00 {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #ffd800;
            flex-shrink: 0;
            padding: 2px 0;
        }

        /* Подробное описание объекта */
        .td2 {
            font-size: 16px;
            color: #ffd800;
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 2px 4px;
            line-height: 1.3;
        }

        /* Блок с фотографией */
        #block {
            flex: 1;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
            padding: 4px;
            width: 100%;
        }

            #block img {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                object-fit: contain;
                display: block;
            }

        /* Описание конкретной фотографии объекта */
        .td1 {
            text-align: center;
            background: #7c82f6;
            color: black;
            font-size: 16px;
            border-radius: 4px;
            padding: 5px 8px;
            flex-shrink: 0;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ====== БЛОК С КНОПКАМИ ====== */
        .tr0 {
            flex-shrink: 0;
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 4px;
            width: 100%;
        }

        .tr0 td {
                display: flex;
                justify-content: center;
                /*align-items: center;*/
                gap: 20px;
                padding: 6px 0;
                height: 52px;
                box-sizing: border-box;
                position: relative;
                /* Ширина устанавливается через JavaScript */
        }

        .button1, .button2 {
            height: 36px;
            z-index: 20;
            background: rgba(255,255,255,0.03);
            /*border: 2px solid white;*/
            border-radius: 8px;
            cursor: pointer;
            /*display: flex !important;
           /* align-items: center;
            justify-content: center;*/
            flex-shrink: 0;
            transition: background 0.2s;
            position: absolute;
            /*position: relative;
            /* Ширина устанавливается через JavaScript */
        }

            .button1:hover, .button2:hover {
                background: rgba(255,255,255,0.5);
            }

            .button1:active, .button2:active {
                background: rgba(255,255,255,0.7);
            }

            .button1 img, .button2 img {
                width: 64px;
                height: 24px;
                /*
                object-fit: contain;
                pointer-events: none;
                display: block;*/
            }

        .incell {
            display: flex; /* Включаем Flexbox */
            justify-content: center; /* Центрируем элементы по горизонтали */
            align-items: center; /* Центрируем элементы по вертикали (опционально) */
            gap: 20px; /* Задаем одинаковый отступ между картинками */
        }

        /* ============================================== */
        /* ====== АДАПТАЦИЯ ДЛЯ СМАРТФОНОВ ====== */
        /* ============================================== */
        .close-button {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        @media (max-width: 768px) and (orientation: portrait) {
            /* Изображение на весь экран с поворотом */
            .close-button {
                display: flex !important;
            }
            .close-button:active {
                    background: rgba(255,255,255,0.5);
                    transform: scale(0.9);
            }
            #img {
                object-fit: cover;
                transform: rotate(90deg) scale(1.6);
                width: 160%;
                height: 160%;
                left: -30%;
                top: -30%;
                z-index: 1;
            }

            #img0 {
                object-fit: cover;
                transform: rotate(90deg) scale(1.6);
                width: 160%;
                height: 160%;
                left: -30%;
                top: -30%;
                z-index: 2;
                pointer-events: none;
            }

            /* Панель на весь экран */
            #div {
                position: fixed !important;
                left: 0 !important;
                right: 0 !important;
                top: 0 !important;
                bottom: 0 !important;
                width: 100% !important;
                height: 100% !important;
                max-height: 100vh !important;
                transform: none !important;
                padding: 10px 12px !important;
                z-index: 100 !important;
                background: rgb(0, 0, 139) !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                display: none;
                flex-direction: column;
                overflow: hidden;
            }

                /* Контент панели */
                #div table {
                    width: 100%;
                    height: 100%;
                    display: flex;
                    flex-direction: column;
                    flex: 1;
                }

                    #div table tbody {
                        display: flex;
                        flex-direction: column;
                        height: 100%;
                        flex: 1;
                    }

                    #div table tr {
                        display: flex;
                        flex-direction: column;
                        flex-shrink: 0;
                    }

                    #div table td {
                        padding: 4px 6px;
                        width: 100%;
                    }

            /* Заголовок объекта - увеличен */
            .td00 {
                font-size: 20px !important;
                padding: 4px 0 !important;
                flex-shrink: 0;
                color: #ffd800;
                font-weight: bold;
            }

            /* Описание объекта - увеличен */
            .td2 {
                font-size: 16px !important;
                max-height: 80px !important;
                overflow-y: auto !important;
                padding: 4px 6px !important;
                flex-shrink: 0;
                line-height: 1.4;
            }

            /* Блок с фотографией - занимает максимум места */
            #block {
                flex: 1 !important;
                min-height: 120px !important;
                max-height: none !important;
                padding: 6px !important;
                background: rgba(255,255,255,0.05);
                border-radius: 8px;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                width: 100%;
            }

                #block img {
                    max-width: 100% !important;
                    max-height: 100% !important;
                    width: auto !important;
                    height: auto !important;
                    object-fit: contain !important;
                    display: block !important;
                }

            /* Описание фотографии */
            .td1 {
                font-size: 15px !important;
                padding: 6px 10px !important;
                min-height: 36px !important;
                flex-shrink: 0;
                background: #7c82f6;
                color: black;
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-top: 2px;
            }

            /* Блок с кнопками - внизу */
            .tr0 {
                flex-shrink: 0 !important;
                margin-top: auto !important;
                border-top: 1px solid rgba(255,255,255,0.3) !important;
                padding-top: 8px !important;
                width: 100% !important;
            }

                .tr0 td {
                    display: flex !important;
                    justify-content: space-between !important;
                    align-items: center !important;
                    padding: 6px 10px !important;
                    height: 64px !important;
                    width: 100% !important;
                    box-sizing: border-box !important;
                }

            /* Кнопки - крупные для пальцев */
            .button1, .button2 {
                width: 64px !important;
                height: 52px !important;
                min-width: 64px !important;
                background: rgba(255,255,255,0.3) !important;
                border: 3px solid white !important;
                border-radius: 12px !important;
                cursor: pointer !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                flex-shrink: 0 !important;
                transition: background 0.2s !important;
            }

                .button1:active, .button2:active {
                    background: rgba(255,255,255,0.6) !important;
                    transform: scale(0.95);
                }

                .button1 img, .button2 img {
                    width: 36px !important;
                    height: 36px !important;
                    object-fit: contain !important;
                    display: block !important;
                    pointer-events: none !important;
                }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            /* Горизонтальная ориентация на планшетах/телефонах - НЕ поворачиваем */
            /* Панель справа, но шире чем на ПК */
            #div {
                position: fixed !important;
                right: 1% !important;
                top: 1% !important;
                width: 32% !important;
                height: 98% !important;
                max-height: 98vh !important;
                transform: none !important;
                padding: 8px 10px !important;
                z-index: 100 !important;
                background: rgb(0, 0, 139) !important;
                border: 2px solid white !important;
                border-radius: 10px !important;
                box-shadow: 0 0 20px rgba(0,0,0,0.5) !important;
                left: auto !important;
                bottom: auto !important;
            }

            .td00 {
                font-size: 16px !important;
            }

            .td1 {
                font-size: 14px !important;
            }

            .td2 {
                font-size: 14px !important;
                max-height: 70px !important;
            }

            #block {
                min-height: 80px !important;
            }

            .button1, .button2 {
                width: 48px !important;
                height: 38px !important;
            }

                .button1 img, .button2 img {
                    width: 26px !important;
                    height: 26px !important;
                }
        }

        @media (max-width: 480px) and (orientation: portrait) {
            #div {
                padding: 6px 8px !important;
            }

            .td00 {
                font-size: 17px !important;
                padding: 2px 0 !important;
            }

            .td2 {
                font-size: 14px !important;
                max-height: 60px !important;
                padding: 2px 4px !important;
            }

            #block {
                min-height: 80px !important;
                padding: 4px !important;
            }

            .td1 {
                font-size: 13px !important;
                padding: 4px 8px !important;
                min-height: 30px !important;
            }

            .tr0 td {
                height: 56px !important;
                padding: 4px 8px !important;
            }

            .button1, .button2 {
                width: 56px !important;
                height: 44px !important;
                min-width: 56px !important;
            }

                .button1 img, .button2 img {
                    width: 30px !important;
                    height: 30px !important;
                }
        }

        @media (min-width: 769px) {
            /* ПК и большие планшеты - без изменений */
            #img {
                transform: none;
                width: 100%;
                height: 100%;
                left: 0;
                top: 0;
            }

            #img0 {
                transform: none;
                width: 100%;
                height: 100%;
                left: 0;
                top: 0;
                pointer-events: none;
            }
        }
    </style>
</head>
<body id="body_id">
    <!-- ФОН (eshera2.jpg) - виден всегда -->
    <img src="images/eshera2.jpg" id="img" onclick="onclick_img()" alt="Фон">

    <!-- КАРТА с кружками (eshera02.png) - поверх фона -->
    <img src="images/eshera02.png" id="img0" onclick="onclick_img0()" alt="Карта">

    <!-- ПРАВАЯ ПАНЕЛЬ с информацией -->
    <div id="div">
        <!-- Кнопка закрытия для мобильной версии -->
        <button id="closePanel" class="close-button" onclick="closePanel()">✕</button>
        <table id="table_id">

            <tr>
                <td id="td00" class="td00"></td> <!--Заголовок объекта-->
            </tr>

            <tr>
                <td id="td2" class="td2"></td>   <!--Подробное описание объекта-->
            </tr>
            <tr>
                <td>
                    <div id="block"></div>       <!--Фотография объекта-->
                </td>
            </tr>
            <tr>
                <td id="td1" class="td1"></td>   <!--Описание фотографии-->
            </tr>
            <tr class="tr0">
                <!--Блок с двумя кнопками-->
                <td>
                    <button id="button_02" class="button2" onclick="onclick_02()">
                        <img src="images/arrow_back.png" alt="Назад" />
                    </button>

                    <button id="button_01" class="button1" onclick="onclick_01()">
                        <img src="images/arrow_next.png" alt="Вперед" />
                    </button>
                </td>
            </tr>

        </table>
    </div>

    <script src="js/site.js"></script>
</body>
</html>
