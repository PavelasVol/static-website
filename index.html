        #mobile-zoom-controls {
            position: fixed;
            left: 15px;
            top: 10px;
            height: 32px;
            width: 190px;
            z-index: 9999;
            display: none; /* По умолчанию скрыты */

            gap: 10px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 12px;
            border-radius: 35px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
            min-width: 70px;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        @media (max-width: 768px) and (orientation: portrait) {

            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
            line-height: 1;
            flex-shrink: 0;
            font-family: Arial, sans-serif;
        }

        /* Кнопка увеличения */
        #zoom-in-btn {
            left: 140px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }

        /* Кнопка сброса */
        #zoom-reset-btn {
            left:80px;
            background: rgba(255, 165, 0, 0.95);
            color: white;
            font-size: 16px;
            border-color: rgba(255, 165, 0, 0.8);
        }

        /* Кнопка уменьшения */
        #zoom-out-btn {
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }

            /* Состояния при нажатии */
            #zoom-in-btn:active,
            #zoom-out-btn:active {
                transform: scale(0.92);
                background: rgba(100, 200, 255, 0.9);
            }

        #zoom-reset-btn:active {
            transform: scale(0.92);
            background: rgba(255, 200, 50, 0.9);
        }

        /* Блокированные кнопки */
        #zoom-in-btn.disabled,
        #zoom-out-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(200, 200, 200, 0.9);
        }

        #zoom-reset-btn.active {
            background: rgba(255, 200, 50, 0.95);
            border-color: rgba(255, 200, 50, 0.9);
        }



    </style>
</head>
<body id="body_id">
    <!-- ФОН (eshera2.jpg) - виден всегда

    <!-- КАРТА с кружками (eshera02.png) - поверх фона -->
    <img src="images/eshera02.png" id="img0" onclick="onclick_img0()" alt="Карта">

    <!-- В HTML, рядом с картой -->
    <div id="map-zoom-indicator" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,0.7);color:white;padding:5px 15px;border-radius:20px;font-size:14px;display:none;">
        Масштаб: <span id="map-zoom-level">1.0</span>x
    </div>


    <!-- ПРАВАЯ ПАНЕЛЬ с информацией -->
    <div id="div">
        <!-- Кнопка закрытия -->
        <button id="closePanelBtn" class="close-panel-btn" onclick="closePanel()">✕</button>
        <!-- Таблица-->
        <table id="table_id">
            <tr>
                <td id="td00" class="td00"></td> <!--Заголовок объекта-->

            </tr>
            <tr>
                <td>
                    <div id="media-container">
                        <!-- Сюда будет вставляться видео или фото -->
                    </div>
                </td>
            </tr>
            <tr>
                <td id="td1" class="td1"></td>   <!--Описание фотографии-->
            </tr>
            <tr class="tr0">
                <!--Блок с двумя кнопками-->
                <td>
                    <button id="button_02" class="button2" onclick="onclick_02()">
                        <img src="images/arrow_back.png" alt="Назад" />
                    </button>

                    <button id="button_01" class="button1" onclick="onclick_01()">
                        <img src="images/arrow_next.png" alt="Вперед" />
                    </button>
                </td>
            </tr>

        </table>
    </div>

    <!-- ====== КНОПКИ УПРАВЛЕНИЯ МАСШТАБОМ (для мобильных устройств) ====== -->
    <div id="mobile-zoom-controls">
        <button id="zoom-in-btn" aria-label="Увеличить масштаб">+</button>
        <button id="zoom-reset-btn" aria-label="Сбросить масштаб">1x</button>
        <button id="zoom-out-btn" aria-label="Уменьшить масштаб">−</button>
