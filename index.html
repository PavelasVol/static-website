<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <link rel="stylesheet" href="css/site.css" />
    <style>
        /* ====== ГЛОБАЛЬНЫЙ СБРОС ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* ====== КАРТИНКИ ====== */
        #img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
            object-fit: contain; /* Вся картинка видна целиком */
            pointer-events: auto;
            background: #000;
        }

        #img0 {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
            object-fit: contain; /* Вся картинка видна целиком */
            pointer-events: none;
            background: transparent;
        }
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        /* ====== ПРАВАЯ ПАНЕЛЬ ====== */
        #div {
            position: fixed;
            z-index: 100;
            display: none;
            background: rgb(0, 0, 139);
            border: 3px solid white;
            border-radius: 8px;
            padding: 8px 10px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

            #div table {
                width: 100%;
                height: 100%;
                background: transparent;
                color: #ffd800;
                border: none;
                display: flex;
                flex-direction: column;
            }

                #div table tbody {
                    display: flex;
                    flex-direction: column;
                    height: 100%;
                }

                #div table tr {
                    display: flex;
                    flex-direction: column;
                    flex-shrink: 0;
                    width: 100%;
                }

                #div table td {
                    padding: 3px 5px;
                    vertical-align: middle;
                    width: 100% !important;
                    box-sizing: border-box;
                }

        /* Заголовок объекта */
        .td00 {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #ffd800;
            flex-shrink: 0;
            padding: 2px 0;
        }

        /* Подробное описание объекта */
        .td2 {
            font-size: 16px;
            color: #ffd800;
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 2px 4px;
            line-height: 1.3;
        }

        /* Блок с фотографией */
        #block {
            flex: 1;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
            padding: 4px;
            width: 100%;
        }

            #block img {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                object-fit: contain;
                display: block;
            }

        /* Описание конкретной фотографии объекта */
        .td1 {
            text-align: center;
            background: #7c82f6;
            color: black;
            font-size: 16px;
            border-radius: 4px;
            padding: 5px 8px;
            flex-shrink: 0;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ====== БЛОК С КНОПКАМИ ====== */
        .tr0 {
            flex-shrink: 0;
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 4px;
            width: 100%;
        }

        .tr0 td {
                display: flex;
                justify-content: center;
                /*align-items: center;*/
                gap: 20px;
                padding: 6px 0;
                height: 52px;
                box-sizing: border-box;
                position: relative;
                /* Ширина устанавливается через JavaScript */
        }

        .button1, .button2 {
            height: 36px;
            z-index: 20;
            background: rgba(255,255,255,0.03);
            /*border: 2px solid white;*/
            border-radius: 8px;
            cursor: pointer;
            /*display: flex !important;
           /* align-items: center;
            justify-content: center;*/
            flex-shrink: 0;
            transition: background 0.2s;
            position: absolute;
            /*position: relative;
            /* Ширина устанавливается через JavaScript */
        }

            .button1:hover, .button2:hover {
                background: rgba(255,255,255,0.5);
            }

            .button1:active, .button2:active {
                background: rgba(255,255,255,0.7);
            }

            .button1 img, .button2 img {
                width: 64px;
                height: 24px;
                /*
                object-fit: contain;
                pointer-events: none;
                display: block;*/
            }

        .incell {
            display: flex; /* Включаем Flexbox */
            justify-content: center; /* Центрируем элементы по горизонтали */
            align-items: center; /* Центрируем элементы по вертикали (опционально) */
            gap: 20px; /* Задаем одинаковый отступ между картинками */
        }

        /* ============================================== */
        /* ====== АДАПТАЦИЯ ДЛЯ СМАРТФОНОВ ====== */
        /* ============================================== */
        @media (max-width: 768px) {
            #div {
                position: fixed; /* Оставляем fixed */
                left: 5% !important; /* Переопределяем через !important */
                right: 5% !important;
                top: 50% !important;
                width: 90% !important;
                height: auto !important;
                max-height: 55vh;
                transform: translateY(-50%);
                padding: 8px;
                z-index: 15;
                background: rgb(0, 0, 139);
            }

            #div table td {
                    padding: 3px;
                    font-size: 12px;
            }

            .td00 {
                font-size: 14px;
            }

            .td1 {
                font-size: 12px;
            }

            .td2 {
                font-size: 12px;
                max-height: 80px;
            }

            #block {
                min-height: 100px;
            }

            #block img {
                    max-height: 150px;
            }

            .button1, .button2 {
                width: 40px;
                height: 35px;
                bottom: 5px;
            }

            .button1 {
                right: 5px;
            }

            .button2 {
                left: 5px;
            }

            .button1 img, .button2 img {
                    width: 25px;
                    height: 25px;
            }
        }

        @media (max-width: 480px) {
            #div {
                left: 2% !important;
                right: 2% !important;
                width: 96% !important;
                max-height: 60vh;
                padding: 5px;
            }

            .td00 {
                font-size: 12px;
            }

            .td1 {
                font-size: 11px;
            }

            .td2 {
                font-size: 11px;
                max-height: 60px;
            }

            #block {
                min-height: 80px;
            }

                #block img {
                    max-height: 100px;
                }

            .button1, .button2 {
                width: 35px;
                height: 30px;
            }

                .button1 img, .button2 img {
                    width: 20px;
                    height: 20px;
                }
        }
    </style>
</head>
<body id="body_id">
    <!-- ФОН (eshera2.jpg) - виден всегда -->
    <img src="images/eshera2.jpg" id="img" onclick="onclick_img()" alt="Фон">

    <!-- КАРТА с кружками (eshera02.png) - поверх фона -->
    <img src="images/eshera02.png" id="img0" onclick="onclick_img0()" alt="Карта">

    <!-- ПРАВАЯ ПАНЕЛЬ с информацией -->
    <div id="div">
        <table id="table_id">
            <tr>
                <td id="td00" class="td00"></td> <!--Заголовок объекта-->
            </tr>

            <tr>
                <td id="td2" class="td2"></td>   <!--Подробное описание объекта-->
            </tr>
            <tr>
                <td>
                    <div id="block"></div>       <!--Фотография объекта-->
                </td>
            </tr>
            <tr>
                <td id="td1" class="td1"></td>   <!--Описание фотографии-->
            </tr>
            <tr class="tr0">                     <!--Блок с двумя кнопками-->
                <td>
                    <button id="button_02" class="button2" onclick="onclick_02()">
                        <img src="images/arrow_back.png" alt="Назад" />
                    </button>
                
                    <button id="button_01" class="button1" onclick="onclick_01()">
                        <img src="images/arrow_next.png" alt="Вперед" />
                    </button>
                </td>
            </tr>

        </table>
    </div>

    <script src="js/site.js"></script>
</body>
</html>
